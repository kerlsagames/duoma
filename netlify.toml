[build]
  command = "npx expo export --platform web"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/sw.js"
    [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[redirects]]
  from = "/api/push/send"
  to = "/.netlify/functions/push-send"
  status = 200

[[redirects]]
  from = "/api/push/daily"
  to = "/.netlify/functions/push-daily"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
